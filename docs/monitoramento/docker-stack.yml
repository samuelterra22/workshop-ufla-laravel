# Stack de monitoramento para Docker Swarm.
# Sobe pelo Portainer (Stacks > Add stack) ou por:
#   docker stack deploy -c docker-stack.yml monitoramento
version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/alert.rules.yml
    volumes:
      - prometheus_data:/prometheus
    networks: [monitoramento]
    deploy:
      placement:
        constraints: [node.role == manager]

  alertmanager:
    image: prom/alertmanager:latest
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    secrets:
      - telegram_bot_token
    networks: [monitoramento]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    command: ['--docker_only=true', '--housekeeping_interval=30s']
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoramento]
    deploy:
      mode: global   # um por nó do cluster

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks: [monitoramento]
    deploy:
      mode: global

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'
    networks: [monitoramento]

configs:
  prometheus_config:
    file: ./prometheus.yml
  prometheus_rules:
    file: ./alert.rules.yml
  alertmanager_config:
    file: ./alertmanager.yml

secrets:
  telegram_bot_token:
    external: true
  grafana_admin_password:
    external: true

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoramento:
    driver: overlay
    attachable: true
