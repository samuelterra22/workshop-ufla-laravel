route:
  receiver: telegram
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers: [severity = "critical"]
      receiver: telegram
      repeat_interval: 30m

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: -1000000000000   # troque pelo id do seu grupo
        api_url: https://api.telegram.org
        parse_mode: HTML
        send_resolved: true
        message: |
          <b>{{ .CommonLabels.severity | toUpper }}</b> — {{ .CommonLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  # Alerta crítico silencia o warning equivalente do mesmo serviço.
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ['alertname', 'instance']
