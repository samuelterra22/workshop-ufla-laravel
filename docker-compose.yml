# Compose do Laravel Sail. Sobe com:
#   ./vendor/bin/sail up -d
#
# Paridade de SERVIÇO e de VERSÃO com produção (mesmo Postgres, mesmo Redis).
# A imagem de produção é outra: o Dockerfile multi-stage com FrankenPHP.
services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.3/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        volumes:
            - '.:/var/www/html'
        networks: [sail]
        depends_on: [pgsql, redis, mailpit, minio]

    pgsql:
        image: 'postgres:17'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-workshop}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
        networks: [sail]
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-workshop}', '-U', '${DB_USERNAME:-sail}']
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks: [sail]
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks: [sail]

    # Object storage S3-compatible para desenvolvimento (paridade com o S3 de produção).
    minio:
        image: 'quay.io/minio/minio:latest'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-sail}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-password}'
        volumes:
            - 'sail-minio:/data'
        networks: [sail]
        command: 'minio server /data'
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            retries: 3
            timeout: 5s

    # Cria o bucket e libera leitura pública, para as URLs de arquivo funcionarem.
    miniomc:
        image: 'quay.io/minio/mc'
        depends_on:
            minio:
                condition: service_healthy
        environment:
            AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-sail}'
            AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-password}'
            AWS_BUCKET: '${AWS_BUCKET:-local}'
        entrypoint: >
            /bin/sh -c "
            /usr/bin/mc alias set myminio http://minio:9000 ${AWS_ACCESS_KEY_ID:-sail} ${AWS_SECRET_ACCESS_KEY:-password};
            /usr/bin/mc mb --ignore-existing myminio/${AWS_BUCKET:-local};
            /usr/bin/mc anonymous set public myminio/${AWS_BUCKET:-local};
            exit 0;
            "
        restart: 'no'
        networks: [sail]

    # Console web para inspecionar o MinIO (o MinIO novo removeu o console próprio).
    opens3-console:
        image: 'opens3/console:latest'
        ports:
            - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:9090'
        environment:
            CONSOLE_MINIO_SERVER: 'http://minio:9000'
            CONSOLE_PBKDF_PASSPHRASE: '${OPENS3_PBKDF_PASSPHRASE:-dev-only-passphrase-change-in-prod-32}'
            CONSOLE_PBKDF_SALT: '${OPENS3_PBKDF_SALT:-dev-only-salt-16}'
        depends_on:
            minio:
                condition: service_healthy
        networks: [sail]

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-minio:
        driver: local
